name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # indicium and indicium-adapters aren't on PyPI yet; install from git
          pip install git+https://github.com/HolobiomicsLab/indicium.git@main
          pip install git+https://github.com/HolobiomicsLab/indicium-adapters.git@main
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=indicium_adapters_metabolomics --cov-report=term-missing
