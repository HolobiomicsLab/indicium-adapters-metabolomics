[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicium-adapters-metabolomics"
version = "0.7.0"
description = "Metabolomics-domain DomainAdapters for the indicium ecosystem: MetabolomicsAdapter, MetaboKGAdapter, EMIAdapter (ENPKG + METRIN-KG)"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Louis-Felix Nothias", email = "louis-felix.nothias@cnrs.fr"}]
keywords = ["metabolomics", "knowledge-graph", "rdf", "shacl", "indicium", "metabokg", "earth-metabolome", "metrin-kg", "domain-adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "indicium-adapters>=0.4.0",
    "indicium>=1.4",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "pyteomics>=4.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.5"]
# Optional: enables _matrix_normalizer (MiniLM-based fuzzy mapping of free-text
# biological-matrix labels to UBERON / PO CURIEs). Wire on with `pip install
# indicium-adapters-metabolomics[ml]` and pass `normalize_matrix=True` to
# `redu_to_claims` / `redu_sample_to_claims`.
ml  = ["sentence-transformers>=3.0", "numpy>=1.26"]

[project.entry-points."indicium.adapters"]
metabolomics = "indicium_adapters_metabolomics.metabolomics:MetabolomicsAdapter"
metabokg     = "indicium_adapters_metabolomics.metabokg:MetaboKGAdapter"
emi          = "indicium_adapters_metabolomics.emi:EMIAdapter"

[project.urls]
Homepage = "https://github.com/HolobiomicsLab/indicium-adapters-metabolomics"
Repository = "https://github.com/HolobiomicsLab/indicium-adapters-metabolomics"
Issues = "https://github.com/HolobiomicsLab/indicium-adapters-metabolomics/issues"
Changelog = "https://github.com/HolobiomicsLab/indicium-adapters-metabolomics/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/indicium_adapters_metabolomics"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.coverage.run]
omit = [
    "src/indicium_adapters_metabolomics/data/build_data.py",
    "src/indicium_adapters_metabolomics/data/build_vocabs.py",
    "src/indicium_adapters_metabolomics/data/build_synonyms.py",
    # _matrix_normalizer is gated on the optional [ml] extra; CI runs the
    # base install so the real-model code paths can't be exercised. The
    # availability + unavailable-branch tests cover the orchestration code,
    # but if a CI image without [ml] runs everything else, we'd drop below
    # 90%. Omit from the threshold; an ml-extra-enabled CI matrix in v0.8.0
    # will re-include it.
    "src/indicium_adapters_metabolomics/_matrix_normalizer.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --cov=indicium_adapters_metabolomics --cov-report=term-missing --cov-fail-under=90"
