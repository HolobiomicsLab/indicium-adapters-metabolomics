[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indicium-adapters-metabolomics"
version = "0.1.0"
description = "Metabolomics-domain DomainAdapters for the indicium ecosystem: MetabolomicsAdapter, MetaboKGAdapter, EMIAdapter (ENPKG + METRIN-KG)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Louis-Felix Nothias"}]
dependencies = [
    "indicium-adapters>=0.3.0",
    "indicium>=1.4",
    "rdflib>=7.0",
    "pyshacl>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.5"]

[project.entry-points."indicium.adapters"]
metabolomics = "indicium_adapters_metabolomics.metabolomics:MetabolomicsAdapter"
metabokg     = "indicium_adapters_metabolomics.metabokg:MetaboKGAdapter"
emi          = "indicium_adapters_metabolomics.emi:EMIAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/indicium_adapters_metabolomics"]

[tool.hatch.build.targets.wheel.force-include]
"src/indicium_adapters_metabolomics/data" = "indicium_adapters_metabolomics/data"
"src/indicium_adapters_metabolomics/shapes" = "indicium_adapters_metabolomics/shapes"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
